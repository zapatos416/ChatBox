<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>BloxChat - Profesional</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- NAVEGACIÓN -->
  <header class="roblox-nav">
    <div class="nav-left">
      <div class="logo" id="navLogoBtn" style="cursor: pointer;">
        <span class="logo-box"></span><span class="logo-text">Blox<span>Chat</span></span>
      </div>
    </div>
    <div class="nav-center">
      <div class="search-box">
        <i class="fa-solid fa-magnifying-glass"></i>
        <input type="text" id="searchInput" placeholder="Buscar salas..." />
      </div>
    </div>
    <div class="nav-right">
      <button id="btnOpenOwnerPanel" class="btn-owner-panel hidden"><i class="fa-solid fa-crown"></i> Panel Owner</button>
      <button id="btnOpenJoinPrivate" class="btn btn-secondary"><i class="fa-solid fa-key"></i> Código Privado</button>
      <button id="btnOpenCreateRoom" class="btn btn-primary"><i class="fa-solid fa-plus"></i> Crear Sala</button>
      <button id="btnOpenAuth" class="btn btn-roblox-login"><i class="fa-solid fa-user"></i> Iniciar Sesión</button>
      <div class="user-chip hidden" id="userProfileChip">
        <div class="avatar" id="navAvatar">U</div>
        <span id="navUsername">Cargando...</span>
        <button id="btnLogout" class="btn-logout"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
      </div>
    </div>
  </header>

  <!-- CATÁLOGO -->
  <main id="catalogView" class="container">
    <div class="feed-header">
      <div>
        <h1>Explorar Salas de Chat</h1>
        <p>Haz clic en una portada para entrar a la conversación</p>
      </div>
      <div class="filter-tabs">
        <button class="filter-btn active" data-category="all">Todos</button>
        <button class="filter-btn" data-category="general">General</button>
        <button class="filter-btn" data-category="gaming">Gaming</button>
      </div>
    </div>
    <div id="roomsGrid" class="rooms-grid"></div>
  </main>

  <!-- CHAT EN VIVO -->
  <section id="chatView" class="chat-container hidden">
    <div class="chat-header">
      <div class="chat-info">
        <button id="btnLeaveRoom" class="btn-icon"><i class="fa-solid fa-arrow-left"></i></button>
        <img id="chatRoomImg" src="" alt="Portada" class="chat-room-thumb" />
        <div>
          <h2 id="chatRoomTitle">Chat</h2>
          <span class="status-badge"><i class="fa-solid fa-circle"></i> En vivo</span>
        </div>
      </div>
      <button id="btnOpenRoomSettings" class="btn-room-settings hidden"><i class="fa-solid fa-gear"></i></button>
    </div>
    <div class="chat-body">
      <div class="chat-main">
        <div class="messages-area" id="messagesArea"></div>
        <div class="chat-composer-wrapper">
          <div id="chatAttachmentBox" class="chat-attachment-preview-box hidden">
            <img id="chatAttachmentImg" src="" class="chat-attachment-thumb" />
            <button id="btnRemoveChatAttachment" class="btn-remove-attachment"><i class="fa-solid fa-xmark"></i></button>
          </div>
          <div class="chat-composer-controls">
            <label class="btn-icon-attach"><i class="fa-solid fa-image"></i><input type="file" id="inputChatGallery" accept="image/*" class="hidden" /></label>
            <input type="text" id="chatInput" placeholder="Escribe un mensaje..." autocomplete="off" />
            <button id="btnSendMessage" class="btn-send"><i class="fa-solid fa-paper-plane"></i></button>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- MODALES DE AUTENTICACIÓN Y GESTIÓN -->
  <div id="modalAuth" class="modal-overlay hidden">
    <div class="modal-card modal-sm auth-card">
      <button class="modal-close btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
      <h2>BloxChat</h2>
      <p class="modal-subtitle">Conéctate para chatear</p>
      <div class="auth-buttons">
        <button id="btnLoginGoogle" class="btn-auth btn-google"><i class="fa-brands fa-google"></i> Continuar con Google</button>
      </div>
    </div>
  </div>

  <div id="modalUserProfile" class="modal-overlay hidden">
    <div class="modal-card modal-sm">
      <button class="modal-close btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
      <h2>Perfil</h2>
      <form id="formUserProfile">
        <div class="form-group">
          <label>Nombre de Usuario</label>
          <input type="text" id="profileUsernameInput" required />
          <small id="usernameCooldownNotice" class="hidden" style="color:#f39c12;">Cambio disponible en <span id="daysRemainingText"></span> días.</small>
        </div>
        <div style="display:flex; gap:10px; margin-top:20px;">
          <button type="submit" class="btn btn-primary" style="flex:1;">Guardar</button>
          <button type="button" id="btnSwitchAccount" class="btn btn-secondary" style="background:#d90429;">Cambiar Cuenta</button>
        </div>
      </form>
    </div>
  </div>

  <div id="modalPrivateJoin" class="modal-overlay hidden">
    <div class="modal-card modal-sm">
      <button class="modal-close btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
      <h2>Código Privado</h2>
      <form id="formJoinPrivate">
        <div class="form-group"><input type="text" id="joinPrivateCodeInput" placeholder="ID de Sala" required /></div>
        <div class="form-group"><input type="password" id="joinPrivatePassInput" placeholder="Contraseña" required /></div>
        <button type="submit" class="btn btn-primary btn-block">Desbloquear</button>
      </form>
    </div>
  </div>

  <div id="modalCreateRoom" class="modal-overlay hidden">
    <div class="modal-card">
      <button class="modal-close btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
      <h2>Crear Sala</h2>
      <form id="formCreateRoom">
        <div class="form-group"><input type="text" id="createRoomTitle" placeholder="Título" required /></div>
        <div class="form-group"><input type="text" id="createRoomDesc" placeholder="Descripción" required /></div>
        <div class="form-group">
          <select id="createRoomCategory"><option value="general">General</option><option value="gaming">Gaming</option></select>
        </div>
        <div class="form-group">
          <input type="checkbox" id="createRoomIsPrivate" /> <label for="createRoomIsPrivate">Privada (Requiere clave)</label>
        </div>
        <div class="form-group hidden" id="createPasswordContainer">
          <input type="password" id="createRoomPass" placeholder="Clave secreta" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Crear</button>
      </form>
    </div>
  </div>

  <div id="modalDetails" class="modal-overlay hidden">
    <div class="modal-card">
      <button class="modal-close btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
      <div class="modal-banner"><img id="modalImg" src="" /></div>
      <div class="modal-content">
        <h2 id="modalTitle">Nombre</h2>
        <p id="modalDesc">Descripción...</p>
        <button id="btnLaunchChat" class="btn-roblox-green">ENTRAR AL CHAT</button>
      </div>
    </div>
  </div>

  <div id="modalImageViewer" class="modal-overlay hidden" style="background: rgba(0,0,0,0.9);">
    <button class="modal-close btn-close-modal"><i class="fa-solid fa-xmark"></i></button>
    <img id="fullViewImage" src="" style="max-width:90%; max-height:90%; object-fit:contain;" />
  </div>

  <!-- SCRIPT MODULAR -->
  <script type="module" src="script.js"></script>
</body>
</html>
